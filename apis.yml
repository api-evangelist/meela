aid: meela
name: Meela
description: >-
  Meela is an AI voice companion and voice-based ride service built for older
  adults, backed by Bain Capital Ventures. Members connect through scheduled
  phone calls with no app, device, or subscription required — Meela calls on a
  chosen schedule, remembers names, preferences, and past conversations, and
  shares select privacy-conscious insights with caregivers. A "Meela for
  Business" offering brings the same companionship to senior living facilities
  with care-team dashboards, mood/engagement alerts, and EHR documentation, and
  the company advertises HIPAA and SOC 2 compliance. Meela publishes only a
  consumer marketing site and a member sign-in portal; it exposes no public
  developer API, documentation, or SDK surface at this time.
